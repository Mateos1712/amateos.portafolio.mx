<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura y entrega de Campus Pulse</title>
  <desc id="desc">Una API FastAPI pasa por Bitbucket y Jenkins, se publica en ECR y se ejecuta en ECS Fargate detrás de un balanceador con observabilidad en CloudWatch, Prometheus y Grafana.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#0b2542"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123553"/><stop offset="1" stop-color="#0b2138"/></linearGradient>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#5eead4"/></marker>
    <filter id="s2"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg2)"/>
  <text x="64" y="64" fill="#f1f7fb" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="700">Campus Pulse · delivery and runtime</text>
  <text x="64" y="98" fill="#85a3bf" font-family="Inter,Segoe UI,sans-serif" font-size="17">FastAPI · Docker · Jenkins · ECR · ECS Fargate · observability</text>

  <text x="64" y="153" fill="#5eead4" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">DELIVERY FLOW</text>
  <g filter="url(#s2)" font-family="Inter,Segoe UI,sans-serif">
    <g><rect x="64" y="178" width="176" height="80" rx="14" fill="url(#node)" stroke="#4ad7e8"/><text x="152" y="210" text-anchor="middle" fill="#eef7fb" font-size="15" font-weight="700">Feature branch</text><text x="152" y="235" text-anchor="middle" fill="#8da9be" font-size="12">FastAPI + tests</text></g>
    <g><rect x="280" y="178" width="176" height="80" rx="14" fill="url(#node)" stroke="#4ad7e8"/><text x="368" y="210" text-anchor="middle" fill="#eef7fb" font-size="15" font-weight="700">Bitbucket PR</text><text x="368" y="235" text-anchor="middle" fill="#8da9be" font-size="12">checks + webhook</text></g>
    <g><rect x="496" y="178" width="176" height="80" rx="14" fill="url(#node)" stroke="#f5b444"/><text x="584" y="210" text-anchor="middle" fill="#ffd27a" font-size="15" font-weight="700">Jenkins</text><text x="584" y="235" text-anchor="middle" fill="#aebed0" font-size="12">test · scan · build</text></g>
    <g><rect x="712" y="178" width="176" height="80" rx="14" fill="url(#node)" stroke="#7c8cff"/><text x="800" y="210" text-anchor="middle" fill="#b9c0ff" font-size="15" font-weight="700">Amazon ECR</text><text x="800" y="235" text-anchor="middle" fill="#aebed0" font-size="12">image tagged by SHA</text></g>
    <g><rect x="928" y="178" width="248" height="80" rx="14" fill="url(#node)" stroke="#5eead4"/><text x="1052" y="210" text-anchor="middle" fill="#8ff3e5" font-size="15" font-weight="700">Terraform deploy</text><text x="1052" y="235" text-anchor="middle" fill="#aebed0" font-size="12">ECS + smoke test</text></g>
  </g>
  <g stroke="#5eead4" stroke-width="3" marker-end="url(#arr2)"><path d="M240 218H280"/><path d="M456 218H496"/><path d="M672 218H712"/><path d="M888 218H928"/></g>

  <rect x="64" y="305" width="1112" height="319" rx="24" fill="#071a2d" stroke="#287da1" stroke-width="2"/>
  <text x="92" y="342" fill="#5eead4" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">AWS RUNTIME · DEVELOPMENT</text>

  <g filter="url(#s2)" font-family="Inter,Segoe UI,sans-serif">
    <rect x="98" y="377" width="170" height="95" rx="15" fill="#113753" stroke="#4ad7e8"/>
    <text x="183" y="414" text-anchor="middle" fill="#e7f3f8" font-size="16" font-weight="700">Public ALB</text>
    <text x="183" y="442" text-anchor="middle" fill="#90aabd" font-size="12">HTTP · health /healthz</text>

    <rect x="340" y="365" width="430" height="199" rx="19" fill="#0c2942" stroke="#5eead4"/>
    <text x="365" y="399" fill="#8ff3e5" font-size="15" font-weight="700">ECS FARGATE · public subnets · 2 AZ</text>
    <rect x="372" y="430" width="164" height="88" rx="13" fill="#12617b"/>
    <text x="454" y="466" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Task 1</text>
    <text x="454" y="491" text-anchor="middle" fill="#c4edf2" font-size="12">FastAPI · port 8000</text>
    <rect x="574" y="430" width="164" height="88" rx="13" fill="#12617b"/>
    <text x="656" y="466" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Task 2</text>
    <text x="656" y="491" text-anchor="middle" fill="#c4edf2" font-size="12">autoscaling 1–3</text>

    <rect x="836" y="365" width="306" height="96" rx="15" fill="#132d46" stroke="#f5b444"/>
    <text x="989" y="401" text-anchor="middle" fill="#ffd27a" font-size="15" font-weight="700">CloudWatch</text>
    <text x="989" y="429" text-anchor="middle" fill="#a7bac9" font-size="12">logs · metrics · dashboard · alarms</text>
    <rect x="836" y="493" width="306" height="96" rx="15" fill="#132d46" stroke="#7c8cff"/>
    <text x="989" y="529" text-anchor="middle" fill="#bfc5ff" font-size="15" font-weight="700">Prometheus + Grafana</text>
    <text x="989" y="557" text-anchor="middle" fill="#a7bac9" font-size="12">/metrics · dashboards · alerts</text>
  </g>

  <g fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arr2)">
    <path d="M268 424H340"/>
    <path d="M770 424H836"/>
    <path d="M738 500C790 500 790 541 836 541"/>
  </g>
  <path d="M800 258V330H555V365" fill="none" stroke="#7c8cff" stroke-width="3" marker-end="url(#arr2)"/>
  <text x="64" y="676" fill="#718ca3" font-family="Inter,Segoe UI,sans-serif" font-size="14">Security: ALB accepts public HTTP · Fargate tasks accept traffic only from the ALB · IAM execution and task roles</text>
</svg>
