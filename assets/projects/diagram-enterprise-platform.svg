<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Caso profesional de aplicaciones empresariales</title>
  <desc id="desc">Usuarios corporativos se autentican con Active Directory y acceden a aplicaciones desplegadas sobre Linux, Tomcat y contenedores Docker, con diagnóstico mediante línea de comandos y logs.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#13233d"/></linearGradient>
    <linearGradient id="n3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173854"/><stop offset="1" stop-color="#0d2239"/></linearGradient>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#5eead4"/></marker>
  </defs>
