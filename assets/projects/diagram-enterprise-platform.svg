  <text x="64" y="68" fill="#f1f7fb" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="700">Enterprise application support</text>
  <text x="64" y="102" fill="#88a5bd" font-family="Inter,Segoe UI,sans-serif" font-size="17">Linux · Apache Tomcat · Docker · LDAP / Active Directory · Bash</text>
  <rect x="55" y="158" width="1170" height="466" rx="28" fill="#081a2d" stroke="#2a7195" stroke-width="2"/>
