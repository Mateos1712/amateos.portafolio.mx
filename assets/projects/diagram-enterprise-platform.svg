    <text x="833" y="255" text-anchor="middle" fill="#eaf4f8" font-size="17" font-weight="700">Enterprise apps</text>
    <text x="833" y="284" text-anchor="middle" fill="#94adbf" font-size="13">configuration · deployment</text>
