<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura CloudVault en AWS</title>
  <desc id="desc">Terraform crea una VPC con dos zonas de disponibilidad, subredes públicas y privadas, una instancia EC2 con Nginx y un bucket S3 privado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#0a2340"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102c49"/><stop offset="1" stop-color="#0b1d33"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#55d7e7"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="67" fill="#f1f7fb" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="700">CloudVault · AWS infrastructure</text>
  <text x="64" y="101" fill="#85a3bf" font-family="Inter,Segoe UI,sans-serif" font-size="17">Terraform · us-east-1 · VPC 10.0.0.0/16</text>

  <g filter="url(#shadow)">
    <rect x="55" y="170" width="210" height="112" rx="18" fill="url(#panel)" stroke="#7c8cff" stroke-width="2"/>
    <text x="160" y="211" text-anchor="middle" fill="#aeb8ff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">TERRAFORM</text>
    <text x="160" y="243" text-anchor="middle" fill="#d7e3ef" font-family="Inter,Segoe UI,sans-serif" font-size="15">IaC · plan · apply</text>
    <text x="160" y="265" text-anchor="middle" fill="#85a3bf" font-family="Inter,Segoe UI,sans-serif" font-size="13">reproducible deployment</text>
  </g>
  <path d="M265 226H340" stroke="#55d7e7" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="342" y="135" width="875" height="510" rx="28" fill="#071a2e" stroke="#247aa0" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="376" y="174" fill="#5eead4" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">AWS CLOUD</text>
  <rect x="382" y="195" width="610" height="410" rx="24" fill="#0a2036" stroke="#55d7e7" stroke-width="2"/>
  <text x="412" y="230" fill="#dceaf5" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">VPC · 10.0.0.0/16</text>

  <g>
    <rect x="414" y="258" width="258" height="305" rx="18" fill="#0d2943" stroke="#2f86ad"/>
    <text x="437" y="292" fill="#8ecae6" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">Availability Zone A</text>
    <rect x="436" y="316" width="214" height="118" rx="14" fill="#11385a" stroke="#4ad7e8"/>
    <text x="456" y="347" fill="#5eead4" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">PUBLIC SUBNET</text>
    <text x="456" y="370" fill="#9bb5cb" font-family="Inter,Segoe UI,sans-serif" font-size="13">10.0.1.0/24</text>
    <rect x="466" y="386" width="155" height="32" rx="8" fill="#12657b"/>
    <text x="543" y="407" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">EC2 · Nginx · HTTP 80</text>
    <rect x="436" y="458" width="214" height="77" rx="14" fill="#0b2135" stroke="#42647d"/>
    <text x="456" y="489" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">PRIVATE SUBNET</text>
    <text x="456" y="514" fill="#718ca3" font-family="Inter,Segoe UI,sans-serif" font-size="13">10.0.11.0/24 · reserved</text>
  </g>

  <g>
    <rect x="702" y="258" width="258" height="305" rx="18" fill="#0d2943" stroke="#2f86ad"/>
    <text x="725" y="292" fill="#8ecae6" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">Availability Zone B</text>
    <rect x="724" y="316" width="214" height="118" rx="14" fill="#11385a" stroke="#4ad7e8"/>
    <text x="744" y="347" fill="#5eead4" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">PUBLIC SUBNET</text>
    <text x="744" y="370" fill="#9bb5cb" font-family="Inter,Segoe UI,sans-serif" font-size="13">10.0.2.0/24</text>
    <text x="744" y="403" fill="#718ca3" font-family="Inter,Segoe UI,sans-serif" font-size="13">public route table</text>
    <rect x="724" y="458" width="214" height="77" rx="14" fill="#0b2135" stroke="#42647d"/>
    <text x="744" y="489" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">PRIVATE SUBNET</text>
    <text x="744" y="514" fill="#718ca3" font-family="Inter,Segoe UI,sans-serif" font-size="13">10.0.12.0/24 · reserved</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1025" y="226" width="158" height="95" rx="16" fill="#123853" stroke="#59d7e7"/>
    <text x="1104" y="263" text-anchor="middle" fill="#5eead4" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">INTERNET</text>
    <text x="1104" y="289" text-anchor="middle" fill="#aec2d2" font-family="Inter,Segoe UI,sans-serif" font-size="13">Internet Gateway</text>
    <rect x="1025" y="370" width="158" height="150" rx="16" fill="#173047" stroke="#f5b444"/>
    <text x="1104" y="410" text-anchor="middle" fill="#ffd27a" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">S3</text>
    <text x="1104" y="438" text-anchor="middle" fill="#d5dfE7" font-family="Inter,Segoe UI,sans-serif" font-size="13">private bucket</text>
    <text x="1104" y="463" text-anchor="middle" fill="#97adbf" font-family="Inter,Segoe UI,sans-serif" font-size="12">AES-256 · versioning</text>
    <text x="1104" y="486" text-anchor="middle" fill="#97adbf" font-family="Inter,Segoe UI,sans-serif" font-size="12">public access blocked</text>
  </g>
  <path d="M1025 274H982V350H620" fill="none" stroke="#55d7e7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1104 321V350" stroke="#55d7e7" stroke-width="2"/>

  <text x="64" y="680" fill="#718ca3" font-family="Inter,Segoe UI,sans-serif" font-size="14">Security Group: inbound HTTP 80 · S3 outside the VPC · private subnets reserved for future workloads</text>
</svg>
